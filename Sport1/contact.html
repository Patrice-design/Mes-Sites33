<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Sport - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">⚡ Pulse Sport</div>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="activites.html">Activités</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 style="text-align: center; margin-bottom: 20px;">Rejoignez le club</h2>

        <form class="contact-form">
            <div class="form-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label for="email">Adresse E-mail</label>
                <input type="email" id="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label for="sport">Discipline souhaitée</label>
                <input type="text" id="sport" placeholder="Ex: Musculation, Yoga...">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Votre message..."></textarea>
            </div>

            <button type="submit">Envoyer la demande</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Pulse Sport - Réalisé avec Flexbox</p>
    </footer>

</body>
</html>
